version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/fatih/color.Color).Printf
        - (*github.com/fatih/color.Color).Println
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose]

formatters:
  enable:
    - gofmt
