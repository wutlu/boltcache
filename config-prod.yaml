# Production configuration example.
#   BOLTCACHE_TOKEN=$(openssl rand -hex 24) boltcache server --config config-prod.yaml
server:
  mode: "both"
  swaggerui: false
  tcp:
    host: "0.0.0.0"
    port: 6380
    max_connections: 20000
  resp:
    port: 6382
  rest:
    host: "0.0.0.0"
    port: 8090
    cors_enabled: true
    cors_origins: ["https://app.example.com"]   # your front-end origins
    request_timeout: "15s"
    max_request_size: "4MB"

cache:
  max_memory: "4GB"
  eviction_policy: "lru"
  eviction_threshold: 0.9
  cleanup_interval: "1m"
  max_ttl: "720h"

persistence:
  enabled: true
  file: "/var/lib/boltcache/data.json"
  interval: "60s"
  compression: true
  backup_count: 5

security:
  auth:
    enabled: true
    tokens:
      - "${BOLTCACHE_TOKEN}"
  tls:
    enabled: false          # or terminate TLS at your load balancer
    cert_file: "/etc/boltcache/tls.crt"
    key_file: "/etc/boltcache/tls.key"
  rate_limit:
    enabled: true
    requests_per_second: 5000
    burst: 500

logging:
  level: "info"
  format: "json"

monitoring:
  metrics:
    enabled: true
    endpoint: "/metrics"
  health:
    enabled: true
    endpoint: "/health"

performance:
  gc_percent: 75

features:
  lua_scripting: true
  lua_timeout: "2s"
  pub_sub: true
