# Development configuration: everything enabled, auth on with fixed tokens.
#   make run-dev
#   redis-cli -p 6382 -a dev-token-123
#   curl -H "Authorization: Bearer dev-token-123" localhost:8090/info
server:
  mode: "both"
  swaggerui: true
  tcp:
    port: 6380
  resp:
    port: 6382
  rest:
    port: 8090
    cors_enabled: true
    cors_origins: ["http://localhost:3000", "http://localhost:5173"]   # local front-ends

cache:
  max_memory: "512MB"
  eviction_policy: "lru"
  cleanup_interval: "30s"

persistence:
  enabled: true
  file: "./data/dev-cache.json"
  interval: "10s"
  backup_count: 2
  cleanup_when_exceeds: 5

security:
  auth:
    enabled: true
    tokens:
      - "dev-token-123"
      - "test-token-456"

logging:
  level: "debug"
  format: "text"

monitoring:
  profiling:
    enabled: true

features:
  lua_scripting: true
  pub_sub: true
