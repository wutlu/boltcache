services:
  boltcache:
    image: ghcr.io/wutlu/boltcache:latest
    build: .
    ports:
      - "6380:6380"   # TCP (text + RESP)
      - "6382:6382"   # RESP: redis-cli -p 6382
      - "8090:8090"   # REST, WebSocket, /metrics, /docs
    environment:
      BOLTCACHE_AUTH: "false"
      # BOLTCACHE_AUTH: "true"
      # BOLTCACHE_TOKEN: "change-me"
      BOLTCACHE_MAX_MEMORY: "256MB"
    volumes:
      - boltcache-data:/data
    restart: unless-stopped

volumes:
  boltcache-data:
