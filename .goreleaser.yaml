version: 2

project_name: boltcache

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/wutlu/boltcache/v2/appinfo.Version={{ .Version }}
      - -X github.com/wutlu/boltcache/v2/appinfo.Commit={{ .Commit }}
      - -X github.com/wutlu/boltcache/v2/appinfo.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: config/default.yaml
        dst: config.yaml

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md (--release-notes in release.yml).
# Note: "changelog: disable: true" would make GoReleaser drop them too.

release:
  draft: false
  prerelease: auto
  mode: keep-existing
